name: Boutique CI Pipeline

on:
  push:
    branches:
      - main

  workflow_dispatch:

env:
  # Region isn't sensitive, and the `secrets` context is NOT available in
  # top-level env (only github/vars/inputs). Set AWS_REGION as a repo Variable,
  # or hardcode it. Falls back to ap-south-1 if the variable is unset.
  AWS_REGION: ${{ vars.AWS_REGION }}
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        service:
          - auth
          - gateway
          - orders
          - order-service
          - product-service
          - user-service
          - frontend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        run: |
          aws ecr get-login-password --region $AWS_REGION | \
          docker login --username AWS \
          --password-stdin ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.$AWS_REGION.amazonaws.com
     
      - name: Build Docker Image
        run: |
          if [ "${{ matrix.service }}" == "frontend" ]; then
            BUILD_PATH="boutique-microservices/frontend"
          else
            BUILD_PATH="boutique-microservices/backend/services/${{ matrix.service }}"
          fi

          echo "Building from $BUILD_PATH"

          docker build \
            -t ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.$AWS_REGION.amazonaws.com/${{ matrix.service }}:$IMAGE_TAG \
          $BUILD_PATH


      - name: Push Docker Image
        run: |
          IMAGE_URI=${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.$AWS_REGION.amazonaws.com/${{ matrix.service }}:$IMAGE_TAG
          echo "Pushing $IMAGE_URI"
          docker push $IMAGE_URI

  update-manifests:
    runs-on: ubuntu-latest
    needs: build-and-push
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Bump Helm image tag
        run: |
          NEW_TAG=${{ github.sha }}
          VALUES=helm/apps/boutique.yaml

          # All service images share one tag via global.imageTag in the app's
          # Helm values; the registry host (account + region) lives in
          # global.registry. So CI only bumps the tag and stays account/region
          # agnostic. Targets the single 2-space-indented "imageTag:" line.
          sed -i -E "s|^(  imageTag:).*|\1 ${NEW_TAG}|" "$VALUES"

          echo "Updated imageTag in ${VALUES}:"
          grep -nE '^  imageTag:' "$VALUES"

      - name: Commit and push updated values
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add helm/apps/boutique.yaml
          git diff --staged --quiet || git commit -m "ci: bump Helm imageTag to ${{ github.sha }}"
          git push