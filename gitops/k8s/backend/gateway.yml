apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: boutique
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
        - name: gateway
          image: 018442532737.dkr.ecr.ap-south-1.amazonaws.com/gateway:d62edf0dd4f9a8056cdf8ec065445782b59fa774
          ports:
            - containerPort: 3001
          env:
            - name: NODE_ENV
              value: development
            - name: PORT
              value: "3001"
            - name: AUTH_SERVICE_URL
              value: "http://auth:3002"
            - name: PRODUCTS_SERVICE_URL
              value: "http://product-service:3003"
            - name: ORDER_SERVICE_URL
              value: "http://order-service:3004"
            - name: ORDERS_SERVICE_URL
              value: "http://orders:3005"
            - name: USERS_SERVICE_URL
              value: "http://user-service:3006"
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: boutique
  labels:
    app: gateway
    monitored: "true"
  annotations:
    # Per-target-group health check for the gateway. Its "/" returns 404
    # (catch-all handler), so point the ALB at the gateway's /health endpoint,
    # which returns 200. Overrides the Ingress-wide healthcheck-path (/) for
    # this service only; the frontend keeps using "/".
    alb.ingress.kubernetes.io/healthcheck-path: /health
spec:
  selector:
    app: gateway
  ports:
    - name: http
      protocol: TCP
      port: 3001
      targetPort: 3001
  type: ClusterIP

