name: DevBoard CI Pipeline

on:
  push:
    branches:
      - main
    # Only build DevBoard when its sources (or this workflow) change.
    paths:
      - "devboard-app-with-docker-ai/**"
      - ".github/workflows/devboard-ci.yml"
      - "helm/apps/devboard.yaml"

  workflow_dispatch:

env:
  # Region isn't sensitive; set AWS_REGION as a repo Variable. Falls back below.
  AWS_REGION: ${{ vars.AWS_REGION }}
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          # ECR repo name  <->  Docker build context. Service name in the Helm
          # values ("backend") differs from the ECR repo ("devboard-backend").
          - repo: devboard-backend
            context: devboard-app-with-docker-ai/backend
          - repo: devboard-frontend
            context: devboard-app-with-docker-ai/frontend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        run: |
          aws ecr get-login-password --region $AWS_REGION | \
          docker login --username AWS \
          --password-stdin ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.$AWS_REGION.amazonaws.com

      - name: Build Docker Image
        run: |
          echo "Building ${{ matrix.repo }} from ${{ matrix.context }}"
          docker build \
            -t ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.$AWS_REGION.amazonaws.com/${{ matrix.repo }}:$IMAGE_TAG \
            ${{ matrix.context }}

      - name: Push Docker Image
        run: |
          IMAGE_URI=${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.$AWS_REGION.amazonaws.com/${{ matrix.repo }}:$IMAGE_TAG
          echo "Pushing $IMAGE_URI"
          docker push $IMAGE_URI

  update-manifests:
    runs-on: ubuntu-latest
    needs: build-and-push
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Bump Helm image tag
        run: |
          NEW_TAG=${{ github.sha }}
          VALUES=helm/apps/devboard.yaml

          # Both service images share one tag via global.imageTag; the registry
          # host lives in global.registry. CI only bumps the tag and stays
          # account/region agnostic. Targets the single 2-space-indented line.
          sed -i -E "s|^(  imageTag:).*|\1 ${NEW_TAG}|" "$VALUES"

          echo "Updated imageTag in ${VALUES}:"
          grep -nE '^  imageTag:' "$VALUES"

      - name: Commit and push updated values
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add helm/apps/devboard.yaml
          git diff --staged --quiet || git commit -m "ci: bump DevBoard Helm imageTag to ${{ github.sha }}"
          git push
