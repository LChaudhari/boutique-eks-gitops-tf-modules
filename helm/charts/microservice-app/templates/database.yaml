{{- if and .Values.database.enabled (eq .Values.database.mode "in-cluster") }}
{{- $ns := include "app.namespace" . -}}
{{- $secretName := include "app.secretName" . -}}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Values.database.name }}
  namespace: {{ $ns }}
spec:
  serviceName: {{ .Values.database.name }}
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: {{ .Values.database.image | default "postgres:15-alpine" }}
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: {{ .Values.database.user | default "postgres" | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.passwordSecret | default $secretName }}
                  key: {{ .Values.database.passwordKey | default "POSTGRES_PASSWORD" }}
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U {{ .Values.database.user | default "postgres" }}"]
            initialDelaySeconds: 10
            periodSeconds: 5
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes:
          - ReadWriteOnce
        # gp3 (from the addons module) is encrypted at rest, unlike default gp2.
        storageClassName: {{ .Values.database.storageClass | default "gp3" }}
        resources:
          requests:
            storage: {{ .Values.database.storage | default "10Gi" }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.database.name }}
  namespace: {{ $ns }}
spec:
  clusterIP: None
  selector:
    app: postgres
  ports:
    - port: 5432
{{- end }}
