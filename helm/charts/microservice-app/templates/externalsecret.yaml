{{- if .Values.externalSecret.enabled }}
{{- $target := .Values.externalSecret.target.name | default (include "app.secretName" .) -}}
{{- if and .Values.secret.enabled (eq $target (include "app.secretName" .)) }}
{{- fail "secret.enabled and externalSecret both target the same Secret name. Set secret.enabled=false to source credentials from AWS Secrets Manager via ESO." }}
{{- end }}
# Pulls credentials from an external store (e.g. AWS Secrets Manager) into a
# Kubernetes Secret named {{ $target }}, which the Deployments/DB then read like
# any other Secret. Requires External Secrets Operator installed and a
# (Cluster)SecretStore authenticated to AWS (IRSA).
apiVersion: {{ .Values.externalSecret.apiVersion | default "external-secrets.io/v1" }}
kind: ExternalSecret
metadata:
  name: {{ include "app.name" . }}-external-secret
  namespace: {{ include "app.namespace" . }}
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval | default "1h" }}
  secretStoreRef:
    name: {{ required "externalSecret.secretStoreRef.name is required" .Values.externalSecret.secretStoreRef.name }}
    kind: {{ .Values.externalSecret.secretStoreRef.kind | default "ClusterSecretStore" }}
  target:
    name: {{ $target }}
    creationPolicy: {{ .Values.externalSecret.target.creationPolicy | default "Owner" }}
  {{- with .Values.externalSecret.data }}
  data:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.externalSecret.dataFrom }}
  dataFrom:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
